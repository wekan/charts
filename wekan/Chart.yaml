apiVersion: v2
appVersion: "11.32"
# charts#55: the database is FerretDB, and charts#54 is why it is not a
# dependency on somebody else's chart any more. The old MongoDB dependency
# (groundhog2k) named its services one way while wekan/templates/_helpers.tpl
# built a MONGO_URL out of Bitnami's naming, so WeKan dialled a host that did not
# exist. FerretDB is defined by this chart now - templates/ferretdb-*.yaml - so
# the Service name in MONGO_URL is this chart's own and cannot drift.
#
# An external database (a MongoDB you run yourself, a FerretDB elsewhere, a
# managed service) is still supported: set externalDatabase.url in values.yaml
# and ferretdb.enabled=false.
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: WeKan updated to v11.32
      links:
        - name: Release notes
          url: https://github.com/wekan/wekan/releases/tag/v11.32
        - name: CHANGELOG
          url: https://github.com/wekan/wekan/blob/main/CHANGELOG.md
  artifacthub.io/images: |
    - name: wekan
      image: ghcr.io/wekan/wekan:v11.32
    - name: ferretdb
      image: ghcr.io/wekan/ferretdb:latest
