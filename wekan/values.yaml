#  - name: "METRICS_ALLOWED_IP_ADDRESSES"
#    value: "192.168.0.100,192.168.0.200"
# -----------------------------------------------------------------
# ==== OUTGOING WEBHOOKS ====
# What to send to Outgoing Webhook, or leave out. If commented out the default values will be: cardId,listId,oldListId,boardId,comment,user,card,commentId,swimlaneId,customerField,customFieldValue
#  - name: "WEBHOOKS_ATTRIBUTES"
#    value: "cardId,listId,oldListId,boardId,comment,user,card,board,list,swimlane,commentId"
# -----------------------------------------------------------------
# ==== Debug OIDC OAuth2 etc ====
