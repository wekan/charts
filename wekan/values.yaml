# ------------------------------------------------------------------------------
# Wekan:
#
# The database is FerretDB (charts#55), installed by this chart itself - see the
# `ferretdb:` section near the bottom. Every FerretDB-specific setting below says
# what it would be on MongoDB instead, so the two files WeKan ships can be read
# beside this one:
#
#   FerretDB   https://github.com/wekan/wekan/blob/main/docker-compose.yml
#   MongoDB 7  https://github.com/wekan/wekan/blob/main/docker-compose-mongodb-v7.yml
#
# Running WeKan in PRODUCTION - reverse proxy, TLS, backups and restore, logs,
# and the rest of what a real deployment needs - is documented at
#
#   https://github.com/wekan/wekan/tree/main/docs/Platforms/FOSS/Container/Docker/Meteor3
#
# It is written for Docker, and everything in it that is about WeKan rather than
# about Docker applies here unchanged.
# ------------------------------------------------------------------------------
## Define platform where helm chart is deployed (set to 'openshift' to disable initContainer with chown command) 
platform: kubernetes

## Define serviceAccount names to create or use. Defaults to component's fully
## qualified name.
##
serviceAccounts:
  create: true
  name: ""
  annotations: ""
  automount: false

## Wekan image configuration
##
image:
  repository: ghcr.io/wekan/wekan
  tag: v11.29
  pullPolicy: IfNotPresent

## Configuration for wekan component
##

replicaCount: 1
dbname: wekan

## Environment given to the WeKan container.
##
## These are the settings WeKan's own docker-compose.yml runs FerretDB with, and
## each one below says what it would be on MongoDB instead - the two sets are NOT
## interchangeable, and the differences are the ones between
##
##   FerretDB   https://github.com/wekan/wekan/blob/main/docker-compose.yml
##   MongoDB 7  https://github.com/wekan/wekan/blob/main/docker-compose-mongodb-v7.yml
##
## Running WeKan in production - reverse proxies, TLS, backups, restore, logs,
## the lot - is documented at
## https://github.com/wekan/wekan/tree/main/docs/Platforms/FOSS/Container/Docker/Meteor3
##
## https://github.com/wekan/charts/issues/34
env:
  # FerretDB has no MongoDB change streams, and its v1 OpLog on the SQLite
  # backend keeps CPU pinned (wekan/wekan#6503, #6480, #6481) - so polling, with
  # the calmer poll intervals WeKan defaults to, is what is verified here.
  #
  # ON MONGODB 7 (docker-compose-mongodb-v7.yml): the replica set gives you
  # change streams, and that file uses
  #   - METEOR_REACTIVITY_ORDER=changeStreams,oplog,polling
  # with no DEFAULT_METEOR_REACTIVITY_ORDER. Change streams need mongod started
  # with --replSet and the set INITIATED (rs.initiate) - the MongoDB compose file
  # does that in the database container's own command.
  - name: "DEFAULT_METEOR_REACTIVITY_ORDER"
    value: "polling"
  - name: "METEOR_REACTIVITY_ORDER"
    value: "polling"
  # uws does not work on s390x; sockjs does, everywhere.
  #
  # ON MONGODB 7: that file ships `DDP_TRANSPORT=uws`, with sockjs commented
  # beside it. uws is faster where it works; on s390x it does not.
  - name: "DDP_TRANSPORT"
    value: "sockjs"
  # Where attachments and avatars are written. Matches sharedDataFolder.path
  # below, and is the same on either database - it is a WeKan setting, not a
  # database one.
  - name: "WRITABLE_PATH"
    value: "/data"
  # Export Board needs it. Same on either database.
  - name: "WITH_API"
    value: "true"

  ## MONGO_URL is NOT here on purpose: the chart computes it from the FerretDB
  ## Service it installs (templates/_helpers.tpl), which is what charts#54 was
  ## about. Set externalDatabase.url instead to point at your own database, and
  ## the chart leaves it alone.
  ##
  ## FerretDB (this chart):
  ##   mongodb://<release>-ferretdb:27017/wekan?directConnection=true
  ## MongoDB 7 (docker-compose-mongodb-v7.yml):
  ##   MONGO_URL=mongodb://wekandb:27017/wekan
  ##
  ## directConnection=true is required for FerretDB and harmless for a
  ## single-node MongoDB (wekan/wekan#6582): without it the driver does
  ## replica-set discovery, drops the host in the URL and dials the address the
  ## server advertises, which for FerretDB is 0.0.0.0:27017.
  ##
  ## MONGO_OPLOG_URL is deliberately absent as well: setting it makes Meteor
  ## start an OpLog tail whatever METEOR_REACTIVITY_ORDER says.
  ##
  ## MongoDB 7 uses it, because there the OpLog is a real replica-set OpLog:
  ##   MONGO_OPLOG_URL=mongodb://wekandb:27017/local?replicaSet=rs0
  ## On FerretDB v1 that tail is what pins the CPU, so it stays unset here.

## EVERY OTHER SETTING WeKan takes, copied from the project's own
## docker-compose.yml (https://github.com/wekan/wekan/blob/main/docker-compose.yml)
## with its comments, so this file is a complete reference rather than a subset
## somebody has to guess the rest of. Uncomment what you need and add it to `env`
## above, or to `secretEnv` when it is a password or a token.
##
## Mail, LDAP, OAuth2/OIDC, SAML, CAS, S3, rate limits, Matomo, browser policy,
## webhooks, accounts lockout, notifications, logging - all of it is below.
##
## ---------------------------------------------------------------------------
# -------------------- USING MONGODB CHANGE STREAMS WITH REPLICA SETS AT CURRENT DATABASE --------------------
# If you would not like to use Change Streams and replica set for improving speed, change to use polling:
#  - name: "METEOR_REACTIVITY_ORDER"
#    value: "polling"
# https://forums.meteor.com/t/meteor-3-5-beta-change-streams-performance-improvements/64461#change-streams-setup-3
# https://github.com/meteor/meteor/blob/release-3.5/v3-docs/docs/performance/change-streams-observer-driver.md#choosing-the-reactivity-driver-order
# Keep oplog/polling fallback available for deployments that cannot use Change Streams:
# https://github.com/wekan/wekan/issues/6307#issuecomment-4299349231
# wekan/wekan#6503/#6480/#6481: FerretDB v1 CAN tail an OpLog (the ferretdb
# service above runs with --repl-set-name=rs0). On the SQLite backend that
# tail keeps FerretDB CPU pinned (~190–390% even idle) and a struggling tail
# shows as "oplog catching up took too long" and stalls loading; on this
# backend it is simply UNVERIFIED. Either way FerretDB has no MongoDB change
# streams, so the DEFAULT here is POLLING ONLY. To try OpLog tailing, set both
# to `oplog,polling` and uncomment MONGO_OPLOG_URL in the wekan service below.
#  - name: "DEFAULT_METEOR_REACTIVITY_ORDER"
#    value: "polling"
#  - name: "METEOR_REACTIVITY_ORDER"
#    value: "polling"
# uws does not work at s390x. sockjs works.
#  - name: "DDP_TRANSPORT"
#    value: "uws"
#  - name: "DDP_TRANSPORT"
#    value: "sockjs"
# -----------------------------------------------------------------
# ==== WRITEABLE PATH FOR FILE UPLOADS ====
#  - name: "WRITABLE_PATH"
#    value: "/data"
# -----------------------------------------------------------------
# ==== AWS S3 FOR FILES ====
# Any region. For example:
# us-standard,us-west-1,us-west-2,
# eu-west-1,eu-central-1,
# ap-southeast-1,ap-northeast-1,sa-east-1
# 
#  - name: "S3"
#    value: "'{\"s3\":{\"key\": \"xxx\", \"secret\": \"xxx\", \"bucket\": \"xxx\", \"region\": \"xxx\"}}'"
#  - name: "S3_SECRET_FILE"
#    value: "/run/secrets/s3_secret"
# -----------------------------------------------------------------
# ==== MONGO_URL — points to FerretDB (MongoDB-compatible) ====
# directConnection=true is REQUIRED (wekan/wekan#6582). The ferretdb service
# above runs with --repl-set-name=rs0, so its handshake advertises a replica
# set whose only member is its own LISTEN address, 0.0.0.0:27017. Without
# directConnection the MongoDB driver does replica-set discovery: it drops the
# host written here and dials the advertised 0.0.0.0:27017 instead, which
# inside the wekan container is the wekan container itself — that is the
# "MongoServerSelectionError: connect ECONNREFUSED 0.0.0.0:27017" a fresh
# `docker compose up` died with. directConnection=true keeps the driver on
# exactly this host. OpLog tailing is unaffected: Meteor only needs setName in
# the handshake, which is still there.
#  - name: "MONGO_URL"
#    value: "mongodb://wekan-ferretdb:27017/wekan?directConnection=true"
#  - name: "MONGO_URL"
#    value: "mongodb://ferretdb:27017/wekan?directConnection=true"
#  - name: "MONGO_PASSWORD_FILE"
#    value: "/run/secrets/mongo_password"
# ---------------------------------------------------------------
# ==== ROOT_URL SETTING ====
# Change ROOT_URL to your real Wekan URL, for example:
# If you have Caddy/Nginx/Apache providing SSL
# - https://example.com
# - https://boards.example.com
# This can be problematic with avatars https://github.com/wekan/wekan/issues/1776
# - https://example.com/wekan
# If without https, can be only wekan node, no need for Caddy/Nginx/Apache if you don't need them
# - http://example.com
# - http://boards.example.com
# - http://192.168.1.100    <=== using at local LAN
#  - name: "ROOT_URL"
#    value: "http://localhost  #   <=== using only at same laptop/desktop where Wekan is installed"
# ---------------------------------------------------------------
# ==== EMAIL SETTINGS ====
# Email settings are only at MAIL_URL and MAIL_FROM.
# Admin Panel has test button, but it's not used for settings.
# see https://github.com/wekan/wekan/blob/main/docs/Email/Troubleshooting-Mail.md
# For SSL in email, change smtp:// to smtps://
# NOTE: Special characters need to be url-encoded in MAIL_URL.
# You can encode those characters for example at: https://www.urlencoder.org
#  - name: "MAIL_URL"
#    value: "smtp://user:pass@mailserver.example.com:25/"
#  - name: "MAIL_URL"
#    value: "smtp://<mail_url>:25/?ignoreTLS=true&tls={rejectUnauthorized:false}"
#  - name: "MAIL_FROM"
#    value: "Wekan Notifications <noreply.wekan@mydomain.com>"
# Currently MAIL_SERVICE is not in use.
#  - name: "MAIL_SERVICE"
#    value: "Outlook365"
#  - name: "MAIL_SERVICE_USER"
#    value: "firstname.lastname@hotmail.com"
#  - name: "MAIL_SERVICE_PASSWORD"
#    value: "SecretPassword"
#  - name: "MAIL_SERVICE_PASSWORD_FILE"
#    value: "/run/secrets/mail_service_password"
# ---------------------------------------------------------------
# https://github.com/wekan/wekan/issues/3585#issuecomment-1021522132
# Add more Node heap, this is done by default at Dockerfile:
#  - name: "NODE_OPTIONS"
#    value: "--max_old_space_size=4096"
# Add more stack, this is done at Dockerfile:
# bash -c "ulimit -s 65500; exec node --stack-size=65500 main.js"
# ---------------------------------------------------------------
# ==== OPTIONAL: MONGO OPLOG SETTINGS =====
# https://github.com/wekan/wekan-mongodb/issues/2#issuecomment-378343587
# HIGHLY RECOMMENDED for pub/sub performance!
# MongoDB oplog is used by Meteor for real-time data synchronization.
# Without oplog, Meteor falls back to polling which increases:
# - CPU usage by 3-5x
# - Network traffic significantly
# - Latency from 50ms to 2000ms
# Must configure MongoDB replica set first
# See: https://blog.meteor.com/tuning-meteor-mongo-livedata-for-scalability-13fe9deb8908
# FerretDB v1 CAN emulate the OpLog via --repl-set-name=rs0 (set on the
# ferretdb service above). On the SQLite backend that tail keeps FerretDB CPU
# pinned and stalls loading (wekan/wekan#6503); on this backend it is
# UNVERIFIED, so it is DISABLED by default here too. Merely SETTING
# MONGO_OPLOG_URL makes Meteor start an OpLog tail regardless of the
# reactivity order (#6498), so it is commented out. To try OpLog tailing,
# uncomment the next line AND set METEOR_REACTIVITY_ORDER=oplog,polling above.
# directConnection=true for the same reason as MONGO_URL above (#6582).
#  - name: "MONGO_OPLOG_URL"
#    value: "mongodb://ferretdb:27017/local?replicaSet=rs0&directConnection=true"
# ---------------------------------------------------------------
# ==== OPTIONAL: KADIRA PERFORMANCE MONITORING FOR METEOR ====
# https://github.com/edemaine/kadira-compose
# https://github.com/meteor/meteor-apm-agent
# https://blog.meteor.com/kadira-apm-is-now-open-source-490469ffc85f
#  - name: "APM_OPTIONS_ENDPOINT"
#    value: "http://<kadira-ip>:11011"
#  - name: "APM_APP_ID"
#    value: ""
#  - name: "APM_APP_SECRET"
#    value: ""
# ---------------------------------------------------------------
# ==== OPTIONAL: LOGS AND STATS ====
# https://github.com/wekan/wekan/blob/main/docs/Features/Logs.md
# 
# Daily export of Wekan changes as JSON to Logstash and ElasticSearch / Kibana (ELK)
# https://github.com/wekan/wekan-logstash
# 
# Statistics Python script for Wekan Dashboard
# https://github.com/wekan/wekan-stats
# 
# Console, file, and zulip logger on database changes https://github.com/wekan/wekan/pull/1010
# with fix to replace console.log by winston logger https://github.com/wekan/wekan/pull/1033
# but there could be bug https://github.com/wekan/wekan/issues/1094
# 
# There is Feature Request: Logging date and time of all activity with summary reports,
# and requesting reason for changing card to other column https://github.com/wekan/wekan/issues/1598
# ---------------------------------------------------------------
# ==== NUMBER OF SEARCH RESULTS PER PAGE BY DEFAULT ====
#  - name: "RESULTS_PER_PAGE"
#    value: "20"
# ---------------------------------------------------------------
# ==== AFTER OIDC LOGIN, ADD USERS AUTOMATICALLY TO THIS BOARD ID ====
# https://github.com/wekan/wekan/pull/5098
#  - name: "DEFAULT_BOARD_ID"
#    value: "abcd1234"
