#    value: "true"
# ---------------------------------------------
# ==== AUTOLOGIN WITH OIDC/OAUTH2 ====
# https://github.com/wekan/wekan/blob/main/docs/Login/autologin.md
#  - name: "OIDC_REDIRECTION_ENABLED"
#    value: "true"
# OIDC RP-initiated logout endpoint (end_session_endpoint). When set, the
# "Log Out" menu redirects to this endpoint so the identity provider session
# is also ended and the user is returned to Wekan (ROOT_URL) via
# post_logout_redirect_uri, instead of landing on the provider home page
# (which errors for non-admin users). See https://github.com/wekan/wekan/issues/6158
# Keycloak example:
#  - name: "OAUTH2_LOGOUT_ENDPOINT"
#    value: "/realms/<keycloak realm>/protocol/openid-connect/logout"
# -----------------------------------------------------------------
# ==== OAUTH2 ORACLE on premise identity manager OIM ====
#  - name: "ORACLE_OIM_ENABLED"
#    value: "true"
# -----------------------------------------------------------------
# ==== OAUTH2 AZURE ====
# https://github.com/wekan/wekan/blob/main/docs/Login/Azure/Azure.md
# 1) Register the application with Azure. Make sure you capture
# the application ID as well as generate a secret key.
# 2) Configure the environment variables. This differs slightly
# by installation type, but make sure you have the following:
#  - name: "OAUTH2_ENABLED"
#    value: "true"
# Optional OAuth2 CA Cert, see https://github.com/wekan/wekan/issues/3299
#  - name: "OAUTH2_CA_CERT"
#    value: "ABCD1234"
# Use OAuth2 ADFS additional changes. Also needs OAUTH2_ENABLED=true setting.
#  - name: "OAUTH2_ADFS_ENABLED"
#    value: "false"
# Azure AD B2C. https://github.com/wekan/wekan/issues/5242
#  - name: "OAUTH2_B2C_ENABLED"
#    value: "false"
# SECURITY (GHSA-mp7g-hj5q-gxhq): Link an OIDC login to a pre-existing
# Wekan account (password/LDAP) with the same email. OFF by default; when
# false an OIDC login whose email already exists is rejected instead of
# merged, preventing account takeover via spoofed email claims. Only
# enable if you fully trust your OIDC provider's email claims, and even
# then the provider must send email_verified=true for the merge to happen.
#  - name: "OAUTH2_MERGE_EXISTING_USERS"
#    value: "false"
# When false, OAuth2/OIDC login is refused for users that do not already
# have a Wekan account (matched by verified email).
#  - name: "OAUTH2_AUTO_REGISTRATION"
#    value: "true"
# Comma/space separated OAuth2/OIDC group names whose members become Wekan
# admins. Empty = off.
#  - name: "OAUTH2_ADMIN_GROUPS"
#    value: ""
# OAuth2 login style: popup or redirect.
#  - name: "OAUTH2_LOGIN_STYLE"
#    value: "redirect"
# Application GUID captured during app registration:
#  - name: "OAUTH2_CLIENT_ID"
#    value: "xxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxx"
# Secret key generated during app registration:
#  - name: "OAUTH2_SECRET"
#    value: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
#  - name: "OAUTH2_SECRET_FILE"
#    value: "/run/secrets/oauth2_secret"
#  - name: "OAUTH2_SERVER_URL"
#    value: "https://login.microsoftonline.com/"
#  - name: "OAUTH2_AUTH_ENDPOINT"
#    value: "/oauth2/v2.0/authorize"
#  - name: "OAUTH2_USERINFO_ENDPOINT"
#    value: "https://graph.microsoft.com/oidc/userinfo"
#  - name: "OAUTH2_TOKEN_ENDPOINT"
#    value: "/oauth2/v2.0/token"
# The claim name you want to map to the unique ID field:
#  - name: "OAUTH2_ID_MAP"
#    value: "email"
# The claim name you want to map to the username field:
#  - name: "OAUTH2_USERNAME_MAP"
#    value: "email"
# The claim name you want to map to the full name field:
#  - name: "OAUTH2_FULLNAME_MAP"
#    value: "name"
# The claim name you want to map to the email field:
#  - name: "OAUTH2_EMAIL_MAP"
#    value: "email"
# -----------------------------------------------------------------
# ==== OAUTH2 Nextcloud ====
# 1) Register the application with Nextcloud: https://your.nextcloud/index.php/settings/admin/security
# Make sure you capture the application ID as well as generate a secret key.
# Use https://your.wekan/_oauth/oidc for the redirect URI.
# 2) Configure the environment variables. This differs slightly
# by installation type, but make sure you have the following:
#  - name: "OAUTH2_ENABLED"
#    value: "true"
# OAuth2 login style: popup or redirect.
#  - name: "OAUTH2_LOGIN_STYLE"
#    value: "redirect"
# Application GUID captured during app registration:
#  - name: "OAUTH2_CLIENT_ID"
#    value: "xxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxx"
# Secret key generated during app registration:
#  - name: "OAUTH2_SECRET"
#    value: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
#  - name: "OAUTH2_SECRET_FILE"
#    value: "/run/secrets/oauth2_secret"
#  - name: "OAUTH2_SERVER_URL"
#    value: "https://your-nextcloud.tld"
#  - name: "OAUTH2_AUTH_ENDPOINT"
#    value: "/index.php/apps/oauth2/authorize"
#  - name: "OAUTH2_USERINFO_ENDPOINT"
#    value: "/ocs/v2.php/cloud/user?format=json"
#  - name: "OAUTH2_TOKEN_ENDPOINT"
#    value: "/index.php/apps/oauth2/api/v1/token"
# The claim name you want to map to the unique ID field:
#  - name: "OAUTH2_ID_MAP"
#    value: "id"
# The claim name you want to map to the username field:
#  - name: "OAUTH2_USERNAME_MAP"
#    value: "id"
# The claim name you want to map to the full name field:
#  - name: "OAUTH2_FULLNAME_MAP"
#    value: "display-name"
# The claim name you want to map to the email field:
#  - name: "OAUTH2_EMAIL_MAP"
#    value: "email"
# -----------------------------------------------------------------
# ==== OAUTH2 KEYCLOAK ====
# https://github.com/wekan/wekan/blob/main/docs/Login/Keycloak/Keycloak.md  <== MAPPING INFO, REQUIRED
#  - name: "OAUTH2_ENABLED"
#    value: "true"
# OAuth2 login style: popup or redirect.
#  - name: "OAUTH2_LOGIN_STYLE"
#    value: "redirect"
#  - name: "OAUTH2_CLIENT_ID"
#    value: "<Keycloak create Client ID>"
#  - name: "OAUTH2_SERVER_URL"
#    value: "<Keycloak server url - https://keycloak.example.com>"
#  - name: "OAUTH2_AUTH_ENDPOINT"
#    value: "/realms/<keycloak realm>/protocol/openid-connect/auth"
#  - name: "OAUTH2_USERINFO_ENDPOINT"
#    value: "/realms/<keycloak realm>/protocol/openid-connect/userinfo"
#  - name: "OAUTH2_TOKEN_ENDPOINT"
#    value: "/realms/<keycloak realm>/protocol/openid-connect/token"
#  - name: "OAUTH2_SECRET"
#    value: "<keycloak client secret>"
#  - name: "OAUTH2_SECRET_FILE"
#    value: "/run/secrets/oauth2_secret"
#  - name: "OAUTH2_ID_MAP"
#    value: "sub"
#  - name: "OAUTH2_USERNAME_MAP"
#    value: "preferred_username"
#  - name: "OAUTH2_EMAIL_MAP"
#    value: "email"
#  - name: "OAUTH2_FULLNAME_MAP"
#    value: "name"
# -----------------------------------------------------------------
# ==== OAUTH2 DOORKEEPER ====
# https://github.com/wekan/wekan/issues/1874
# https://github.com/wekan/wekan/blob/main/docs/Login/OAuth2.md2
# Enable the OAuth2 connection
#  - name: "OAUTH2_ENABLED"
#    value: "true"
# OAuth2 docs: https://github.com/wekan/wekan/blob/main/docs/Login/OAuth2.md
# OAuth2 login style: popup or redirect.
#  - name: "OAUTH2_LOGIN_STYLE"
#    value: "redirect"
# OAuth2 Client ID.
#  - name: "OAUTH2_CLIENT_ID"
#    value: "abcde12345"
# OAuth2 Secret.
#  - name: "OAUTH2_SECRET"
#    value: "54321abcde"
#  - name: "OAUTH2_SECRET_FILE"
#    value: "/run/secrets/oauth2_secret"
# OAuth2 Server URL.
#  - name: "OAUTH2_SERVER_URL"
#    value: "https://chat.example.com"
# OAuth2 Authorization Endpoint.
#  - name: "OAUTH2_AUTH_ENDPOINT"
#    value: "/oauth/authorize"
# OAuth2 Userinfo Endpoint.
#  - name: "OAUTH2_USERINFO_ENDPOINT"
#    value: "/oauth/userinfo"
# OAuth2 Token Endpoint.
#  - name: "OAUTH2_TOKEN_ENDPOINT"
#    value: "/oauth/token"
# OAUTH2 ID Token Whitelist Fields.
#  - name: "OAUTH2_ID_TOKEN_WHITELIST_FIELDS"
#    value: "\"\""
# OAUTH2 Request Permissions.
#  - name: "OAUTH2_REQUEST_PERMISSIONS"
#    value: "openid profile email"
# OAuth2 ID Mapping
#  - name: "OAUTH2_ID_MAP"
#    value: ""
# OAuth2 Username Mapping
#  - name: "OAUTH2_USERNAME_MAP"
#    value: ""
# OAuth2 Fullname Mapping
#  - name: "OAUTH2_FULLNAME_MAP"
#    value: ""
# OAuth2 Email Mapping
#  - name: "OAUTH2_EMAIL_MAP"
#    value: ""
# -----------------------------------------------------------------
# ==== LDAP: UNCOMMENT ALL TO ENABLE LDAP ====
# https://github.com/wekan/wekan/blob/main/docs/Login/LDAP.md
# For Snap settings see https://github.com/wekan/wekan/blob/main/docs/Platforms/FOSS/Container/Snap/Supported-settings-keys.md
# Most settings work both on Snap and Docker below.
# Note: Do not add single quotes '' to variables. Having spaces still works without quotes where required.
# 
# The default authentication method used if a user does not exist to create and authenticate. Can be set as ldap.
# (this is set properly in the Admin Panel, changing this item does not remove Password login option)
#  - name: "DEFAULT_AUTHENTICATION_METHOD"
#    value: "ldap"
# 
# Enable or not the connection by the LDAP
#  - name: "LDAP_ENABLE"
#    value: "true"
# 
# The port of the LDAP server
#  - name: "LDAP_PORT"
#    value: "389"
# 
# The host server for the LDAP server
#  - name: "LDAP_HOST"
#    value: "localhost"
# 
# -----------------------------------------------------------------
# ==== LDAP AD Simple Auth ====
# 
# Set to true, if you want to connect with Active Directory by Simple Authentication.
# When using AD Simple Auth, LDAP_BASEDN is not needed.
# 
# Example:
#  - name: "LDAP_AD_SIMPLE_AUTH"
#    value: "true"
# 
# === LDAP User Authentication ===
# 
# a) Option to login to the LDAP server with the user's own username and password, instead of
# an administrator key. Default: false (use administrator key).
# 
# b) When using AD Simple Auth, set to true, when login user is used for binding,
# and LDAP_BASEDN is not needed.
# 
# Example:
#  - name: "LDAP_USER_AUTHENTICATION"
#    value: "true"
# 
# Which field is used to find the user for the user authentication. Default: uid.
#  - name: "LDAP_USER_AUTHENTICATION_FIELD"
#    value: "uid"
# 
# === LDAP Default Domain ===
# 
# a) In case AD SimpleAuth is configured, the default domain is appended to the given
# loginname for creating the correct username for the bind request to AD.
# 
# b) The default domain of the ldap it is used to create email if the field is not map
# correctly with the LDAP_SYNC_USER_DATA_FIELDMAP
# 
# Example :
#  - name: "LDAP_DEFAULT_DOMAIN"
#    value: "mydomain.com"
# 
# -----------------------------------------------------------------
# ==== LDAP BASEDN Auth ====
# 
# The base DN for the LDAP Tree
#  - name: "LDAP_BASEDN"
#    value: "ou=user,dc=example,dc=org"
# 
# -----------------------------------------------------------------
# Fallback on the default authentication method
#  - name: "LDAP_LOGIN_FALLBACK"
#    value: "false"
# 
# Reconnect to the server if the connection is lost
#  - name: "LDAP_RECONNECT"
#    value: "true"
# 
# Overall timeout, in milliseconds
#  - name: "LDAP_TIMEOUT"
#    value: "10000"
# 
# Specifies the timeout for idle LDAP connections in milliseconds
#  - name: "LDAP_IDLE_TIMEOUT"
#    value: "10000"
# 
# Connection timeout, in milliseconds
#  - name: "LDAP_CONNECT_TIMEOUT"
#    value: "10000"
# 
# If the LDAP needs a user account to search
#  - name: "LDAP_AUTHENTIFICATION"
#    value: "true"
# 
# The search user DN - You need quotes when you have spaces in parameters
# 2 examples:
#  - name: "LDAP_AUTHENTIFICATION_USERDN"
#    value: "CN=ldap admin,CN=users,DC=domainmatter,DC=lan"
#  - name: "LDAP_AUTHENTIFICATION_USERDN"
#    value: "CN=wekan_adm,OU=serviceaccounts,OU=admin,OU=prod,DC=mydomain,DC=com"
# 
# The password for the search user
#  - name: "LDAP_AUTHENTIFICATION_PASSWORD"
#    value: "pwd"
#  - name: "LDAP_AUTHENTIFICATION_PASSWORD_FILE"
#    value: "/run/secrets/ldap_auth_password"
# 
# Enable logs for the module
#  - name: "LDAP_LOG_ENABLED"
#    value: "true"
# 
# If the sync of the users should be done in the background
#  - name: "LDAP_BACKGROUND_SYNC"
#    value: "false"
# 
# LDAP_BACKGROUND_SYNC_INTERVAL : At which interval does the background task sync in milliseconds
# The format must be as specified in:
# https://bunkat.github.io/later/parsers.html#text
#  - name: "LDAP_BACKGROUND_SYNC_INTERVAL"
#    value: "every 1 hours"
# At which interval does the background task sync in milliseconds.
# Leave this unset, so it uses default, and does not crash.
# https://github.com/wekan/wekan/issues/2354#issuecomment-515305722
#  - name: "LDAP_BACKGROUND_SYNC_INTERVAL"
#    value: "''"
# 
#  - name: "LDAP_BACKGROUND_SYNC_KEEP_EXISTANT_USERS_UPDATED"
#    value: "false"
# 
#  - name: "LDAP_BACKGROUND_SYNC_IMPORT_NEW_USERS"
#    value: "false"
# 
# LDAP_BACKGROUND_SYNC_DISABLE_NONEXISTANT_USERS : When true, the LDAP
# background sync disables users no longer present in LDAP (and re-enables
# them when they reappear).
#  - name: "LDAP_BACKGROUND_SYNC_DISABLE_NONEXISTANT_USERS"
#    value: "false"
# 
# If using LDAPS: LDAP_ENCRYPTION=ssl
#  - name: "LDAP_ENCRYPTION"
#    value: "false"
# 
# The certification for the LDAPS server. Certificate needs to be included in this docker compose.yml file.
#  - name: "LDAP_CA_CERT"
#    value: "-----BEGIN CERTIFICATE-----MIIE+G2FIdAgIC...-----END CERTIFICATE-----"
# 
# Reject Unauthorized Certificate
#  - name: "LDAP_REJECT_UNAUTHORIZED"
#    value: "false"
# 
# Optional extra LDAP filters. Don't forget the outmost enclosing parentheses if needed
#  - name: "LDAP_USER_SEARCH_FILTER"
#    value: ""
# 
# base (search only in the provided DN), one (search only in the provided DN and one level deep), or sub (search the whole subtree)
#  - name: "LDAP_USER_SEARCH_SCOPE"
#    value: "one"
# 
# Which field is used to find the user, like uid / sAMAccountName
#  - name: "LDAP_USER_SEARCH_FIELD"
#    value: "sAMAccountName"
# 
# Used for pagination (0=unlimited)
#  - name: "LDAP_SEARCH_PAGE_SIZE"
#    value: "0"
# 
# The limit number of entries (0=unlimited)
#  - name: "LDAP_SEARCH_SIZE_LIMIT"
#    value: "0"
# 
# Enable the login restriction group filter. Note the authenticated ldap user must be able to query all relevant group data with own login data from ldap.
# When true, only members of LDAP_GROUP_FILTER_GROUP_NAME are allowed to log in.
# NOTE: This flag ONLY controls the login restriction. Admin status sync
# (LDAP_SYNC_ADMIN_STATUS / LDAP_SYNC_ADMIN_GROUPS) and group->role sync
# (LDAP_SYNC_GROUP_ROLES) query LDAP groups independently and do NOT require
# this flag to be true. The group filter metadata below
# (LDAP_GROUP_FILTER_OBJECTCLASS, LDAP_GROUP_FILTER_GROUP_MEMBER_ATTRIBUTE,
# LDAP_GROUP_FILTER_GROUP_MEMBER_FORMAT, LDAP_GROUP_FILTER_GROUP_ID_ATTRIBUTE)
# must still be configured for any group search to work.
#  - name: "LDAP_GROUP_FILTER_ENABLE"
#    value: "false"
# 
# Where the GROUPS are, when they are not under LDAP_BASEDN. Leave this
# unset when users and groups share one subtree: the group searches then
# use LDAP_BASEDN, exactly as they always have. Set it when the directory
# keeps them apart - ou=groups beside ou=people is a common layout - or
# every group search runs under the USER base, finds nothing, and
# LDAP_GROUP_FILTER_ENABLE=true refuses every login (wekan/wekan#5539).
#  - name: "LDAP_GROUP_BASEDN"
#    value: "ou=groups,dc=example,dc=org"
# 
# The object class for filtering. Example: group
#  - name: "LDAP_GROUP_FILTER_OBJECTCLASS"
#    value: ""
# 
# The attribute of a group identifying it. Example: cn
#  - name: "LDAP_GROUP_FILTER_GROUP_ID_ATTRIBUTE"
#    value: ""
# 
# The attribute inside a group object listing its members. Example: member
#  - name: "LDAP_GROUP_FILTER_GROUP_MEMBER_ATTRIBUTE"
#    value: ""
# 
# The format of the value of LDAP_GROUP_FILTER_GROUP_MEMBER_ATTRIBUTE. Example: 'dn' if the users dn is saved as value into the attribute.
#  - name: "LDAP_GROUP_FILTER_GROUP_MEMBER_FORMAT"
#    value: ""
# 
# The group name (id) that matches all users.
#  - name: "LDAP_GROUP_FILTER_GROUP_NAME"
#    value: ""
# 
# LDAP_UNIQUE_IDENTIFIER_FIELD : This field is sometimes class GUID (Globally Unique Identifier). Example: guid
#  - name: "LDAP_UNIQUE_IDENTIFIER_FIELD"
#    value: ""
# 
# LDAP_UTF8_NAMES_SLUGIFY : Convert the username to utf8
#  - name: "LDAP_UTF8_NAMES_SLUGIFY"
#    value: "true"
# 
# LDAP_USERNAME_FIELD : Which field contains the ldap username. username / sAMAccountName
#  - name: "LDAP_USERNAME_FIELD"
#    value: "sAMAccountName"
# 
# LDAP_FULLNAME_FIELD : Which field contains the ldap fullname. fullname / sAMAccountName
#  - name: "LDAP_FULLNAME_FIELD"
#    value: "fullname"
# 
#  - name: "LDAP_MERGE_EXISTING_USERS"
#    value: "false"
# 
# Allow existing account matching by e-mail address when username does not match
#  - name: "LDAP_EMAIL_MATCH_ENABLE"
#    value: "true"
# 
# LDAP_EMAIL_MATCH_REQUIRE : require existing account matching by e-mail address when username does match
#  - name: "LDAP_EMAIL_MATCH_REQUIRE"
#    value: "true"
# 
# LDAP_EMAIL_MATCH_VERIFIED : require existing account email address to be verified for matching
#  - name: "LDAP_EMAIL_MATCH_VERIFIED"
#    value: "true"
# 
# LDAP_EMAIL_FIELD : which field contains the LDAP e-mail address
#  - name: "LDAP_EMAIL_FIELD"
#    value: "mail"
# -----------------------------------------------------------------
#  - name: "LDAP_SYNC_USER_DATA"
#    value: "false"
# 
#  - name: "LDAP_SYNC_USER_DATA_FIELDMAP"
#    value: "{\"cn\":\"name\", \"mail\":\"email\"}"
# 
#  - name: "LDAP_SYNC_GROUP_ROLES"
#    value: ""
# 
# The default domain of the ldap it is used to create email if the field is not map correctly
# with the LDAP_SYNC_USER_DATA_FIELDMAP is defined in setting LDAP_DEFAULT_DOMAIN above.
# 
# Enable/Disable syncing of admin status based on ldap groups:
# NOTE: Admin status sync and group->role sync (LDAP_SYNC_GROUP_ROLES) query
# LDAP groups on their own. They no longer require LDAP_GROUP_FILTER_ENABLE=true,
# which only controls the login restriction filter. The group filter metadata
# (LDAP_GROUP_FILTER_OBJECTCLASS, LDAP_GROUP_FILTER_GROUP_MEMBER_ATTRIBUTE,
# LDAP_GROUP_FILTER_GROUP_MEMBER_FORMAT, LDAP_GROUP_FILTER_GROUP_ID_ATTRIBUTE)
# must still be configured for the group search to work.
#  - name: "LDAP_SYNC_ADMIN_STATUS"
#    value: "true"
# 
# Comma separated list of admin group names to sync.
#  - name: "LDAP_SYNC_ADMIN_GROUPS"
#    value: "group1,group2"
# 
# When true, sync a user's LDAP groups as Wekan Organizations.
#  - name: "LDAP_SYNC_ORGANIZATIONS"
#    value: "false"
# 
# Comma separated allowlist of LDAP group names/patterns to sync as Organizations.
# Wildcards supported: * (any chars), ? (single char). Empty = all of the user's groups.
#  - name: "LDAP_SYNC_ORGANIZATIONS_GROUPS"
#    value: ""
# 
# When true, sync a user's LDAP groups as Wekan Teams.
#  - name: "LDAP_SYNC_TEAMS"
#    value: "false"
# 
# Comma separated allowlist of LDAP group names/patterns to sync as Teams.
# Wildcards supported: * (any chars), ? (single char). Empty = all of the user's groups.
#  - name: "LDAP_SYNC_TEAMS_GROUPS"
#    value: ""
# ---------------------------------------------------------------------
# Login to LDAP automatically with HTTP header.
# In below example for siteminder, at right side of = is header name.
#  - name: "HEADER_LOGIN_ID"
#    value: "HEADERUID"
#  - name: "HEADER_LOGIN_FIRSTNAME"
#    value: "HEADERFIRSTNAME"
#  - name: "HEADER_LOGIN_LASTNAME"
#    value: "HEADERLASTNAME"
#  - name: "HEADER_LOGIN_EMAIL"
#    value: "HEADEREMAILADDRESS"
# SECURITY (GHSA-jggc-qvfc-jr6x): comma-separated allowlist of source IPs
# permitted to use header login. The source IP is the real TCP peer of the
# connection (your reverse proxy), NOT the spoofable X-Forwarded-For header.
# REQUIRED when header login is enabled: if empty/unset, header login fails
# CLOSED and authenticates no one.
#  - name: "HEADER_LOGIN_TRUSTED_IPS"
#    value: "127.0.0.1,10.0.0.2"
# Optional: if WeKan sits behind MULTIPLE proxy hops, list the intermediate
# proxy IPs here. X-Forwarded-For is then honored ONLY when the immediate
# TCP peer is one of these trusted proxies, and the right-most hop that is
# not itself a trusted proxy (the real client) is matched against
# HEADER_LOGIN_TRUSTED_IPS above.
#  - name: "HEADER_LOGIN_TRUSTED_PROXIES"
#    value: "10.0.0.1,10.0.0.2"
# ---------------------------------------------------------------------
# ==== LOGOUT TIMER, probably does not work yet ====
# LOGOUT_WITH_TIMER : Enables or not the option logout with timer
# example : LOGOUT_WITH_TIMER=true
#  - name: "LOGOUT_WITH_TIMER"
#    value: ""
# 
# LOGOUT_IN : The number of days
# example : LOGOUT_IN=1
#  - name: "LOGOUT_IN"
#    value: ""
# 
# LOGOUT_ON_HOURS : The number of hours
# example : LOGOUT_ON_HOURS=9
#  - name: "LOGOUT_ON_HOURS"
#    value: ""
# 
# LOGOUT_ON_MINUTES : The number of minutes
# example : LOGOUT_ON_MINUTES=55
#  - name: "LOGOUT_ON_MINUTES"
#    value: ""
# -------------------------------------------------------------------
# Hide password login form
#  - name: "PASSWORD_LOGIN_ENABLED"
#    value: "true"
# -------------------------------------------------------------------
#  - name: "CAS_ENABLED"
#    value: "true"
#  - name: "CAS_BASE_URL"
#    value: "https://cas.example.com/cas"
#  - name: "CAS_LOGIN_URL"
#    value: "https://cas.example.com/login"
#  - name: "CAS_VALIDATE_URL"
#    value: "https://cas.example.com/cas/p3/serviceValidate"
# ---------------------------------------------------------------------
#  - name: "SAML_ENABLED"
#    value: "true"
#  - name: "SAML_PROVIDER"
#    value: ""
#  - name: "SAML_ENTRYPOINT"
#    value: ""
#  - name: "SAML_ISSUER"
#    value: ""
#  - name: "SAML_CERT"
#    value: ""
#  - name: "SAML_IDPSLO_REDIRECTURL"
#    value: ""
#  - name: "SAML_PRIVATE_KEYFILE"
#    value: ""
#  - name: "SAML_PUBLIC_CERTFILE"
#    value: ""
#  - name: "SAML_IDENTIFIER_FORMAT"
#    value: ""
#  - name: "SAML_LOCAL_PROFILE_MATCH_ATTRIBUTE"
#    value: ""
#  - name: "SAML_ATTRIBUTES"
#    value: ""
# ---------------------------------------------------------------------
# Wait spinner to use
#  - name: "WAIT_SPINNER"
#    value: "Bounce"
# ---------------------------------------------------------------------
# Wait for MongoDB to be healthy (replica-set primary elected) before
# starting WeKan, so index creation does not crash with "Topology is closed".
# If you use FerretDB instead, comment out the wekandb block below and
# uncomment the wekan-ferretdb block.
## ---------------------------------------------------------------------------

# Additional environment variables for Wekan mapped from Secret or ConfigMap
extraEnvFrom: ""
# extraEnvFrom: |
#    - secretRef:
#        name: "{{ template "wekan.fullname" $ }}-test-secret"

## Specify additional secret environmental variables for the
## Deployment. These can e.g. be provided by a Secret and allow
## to store passwords separately
##
secretEnv: {}
  # - name: ""
  ##  value: ""
## Secret created by Helm if true, or managed externally if false
secretManaged: true

service:
  type: ClusterIP
  port: 8080
  annotations: {}
    # prometheus.io/scrape: "true"
    # prometheus.io/port: "8000"
    # prometheus.io/path: "/_/monitoring/metrics"

## Comma-separated string of allowed virtual hosts for external access.
## This should match the ingress hosts
##
endpoint: wekan.local

## Main URL (including http:// or https://) where your Wekan
## instance is accessible
##
root_url: https://wekan.local

## Note: WeKan is usually run at subdomain. Using a subpath is not tested.
## https://github.com/wekan/charts/issues/30
## If configuring the Helm values to run wekan under a subpath,
## the readiness and liveliness probes are still configured
## to call the root path /. This returns a 404 Not Found and
## results in the probe(s) failing, which ultimately results in Kubernetes killing the pod.
##
## Relevent config:
##
##  endpoint: yourcompany.com
##  root_url: https://yourcompany.com/wekan
##  ingress:
##    path: /wekan
##    hosts: [ yourcompany.com ]

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  path: /
  pathtype: ImplementationSpecific
  # This must match 'endpoint', unless your client supports different
  # hostnames.
  hosts: [ wekan.local ]
    # - wekan.local
  tls: []
  #  - secretName: wekan-example-tls
  #    hosts:
  #      - wekan-example.local

route:
  enabled: false

resources:
  requests:
    memory: 128Mi
    cpu: 300m
  limits:
    memory: 1Gi
    cpu: 500m

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

startupProbe:
  enabled: false
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 30

init:
  enabled: true
  image:
    repository: docker.io/busybox
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 100m
  securityContext: {}

test:
  image:
    repository: docker.io/busybox
    tag: latest
## Node labels for pod assignment
## ref: https://kubernetes.io/docs/user-guide/node-selection/
##
nodeSelector: {}

## Tolerations for pod assignment
## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
##
tolerations: []

## Affinity for pod assignment
## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
##
affinity: {}

## Configure an horizontal pod autoscaler
##
autoscaling:
  enabled: true
  config:
    minReplicas: 1
    maxReplicas: 16
    ## Note: when setting this, a `resources.request.cpu` is required. You
    ## likely want to set it to `1` or some lower value.
    ##
    targetCPUUtilizationPercentage: 80

# Optional custom labels for the deployment resource.
deploymentLabels: {}

# Optional custom labels for the pods created by the deployment.
podLabels: {}

# Optional custom annotations for the pods created by the deployment.
podAnnotations: {}

sharedDataFolder:
  enabled: true
  path: /data
  accessMode: ReadWriteOnce
  storageClass:
  resources:
    requests:
      storage: 5Gi


updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1

podSecurityContext: {}
securityContext: {}

extraDeploy: []
# ------------------------------------------------------------------------------
# FerretDB: the database this chart installs (charts#55).
#
# It is defined BY THIS CHART (templates/ferretdb-statefulset.yaml and
# ferretdb-service.yaml) rather than pulled in as a dependency, which is the fix
# for charts#54: the MONGO_URL was assembled from another chart's naming
# convention and pointed at a host that did not exist. The Service name is this
# chart's own now.
#
# The image needs no configuration - SQLite handler, /state, port 27017,
# telemetry off are its own defaults - and is published to three registries by
# https://github.com/wekan/FerretDB/blob/main-v1/.github/workflows/docker.yml .
# Two of the three can be pulled without credentials; see image.repository below.
# ------------------------------------------------------------------------------

ferretdb:
  enabled: true
  image:
    # All THREE registries wekan/FerretDB pushes to serve this image publicly,
    # and that took a fix: ghcr.io/wekan/ferretdb was PRIVATE, because a GHCR
    # package is private until somebody makes it public - and the wekan org had
    # public packages disabled altogether, so the setting was greyed out.
    # Artifact Hub said so about this chart:
    #
    #   error scanning image ghcr.io/wekan/ferretdb:latest: image not found
    #
    # and a cluster would have said ImagePullBackOff. Both the org policy and the
    # package are public now, verified by an anonymous pull of the manifest.
    #
    #   ghcr.io/wekan/ferretdb    (the default, beside ghcr.io/wekan/wekan)
    #   quay.io/wekan/ferretdb
    #   wekanteam/ferretdb        (Docker Hub)
    #
    # If a pull ever fails with "denied" or "not found", check that package's
    # visibility FIRST - wekan org -> Packages -> ferretdb -> Package settings -
    # and remember the other two are one line away.
    #
    # WHAT THIS REPLACED: the chart used to install MongoDB from Docker Hub's
    # official image, docker.io/library/mongo, pinned to 7.0.34 - WeKan needs
    # MongoDB 7, and the chart it came from had moved to 8. That image has no
    # wekan-built mirror, unlike the ones above.
    repository: ghcr.io/wekan/ferretdb
    tag: latest
    # The tag deliberately tracks each wekan/FerretDB release. Always ask the
    # registry so a restarted or recreated pod cannot reuse an older node cache.
    pullPolicy: Always
  # Where the SQLite data lives inside the container. The image declares /state
  # as a VOLUME and defaults its own FERRETDB_STATE_DIR / FERRETDB_SQLITE_URL to
  # it; changing this changes both.
  dataPath: /state
  service:
    type: ClusterIP
    port: 27017
    annotations: {}
  storage:
    size: 8Gi
    accessMode: ReadWriteOnce
    # storageClassName: ""
    # Use a PersistentVolumeClaim you created yourself. When set, no
    # volumeClaimTemplate is generated.
    # existingClaim: ""
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 2Gi
      cpu: 1000m
  # The image runs as uid/gid 1000 (ferretdb) from a `scratch` base - no shell,
  # no root. fsGroup lets it write the mounted volume on clusters that do not
  # chown it for you.
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  # A TCP check, not a MongoDB ping: the image has no shell and no mongosh to run
  # one with.
  readinessProbe:
    tcpSocket:
      port: mongo
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    tcpSocket:
      port: mongo
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  # Extra environment for the FerretDB container, e.g. FERRETDB_LOG_LEVEL.
  env: []
  # fullnameOverride: ""
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ------------------------------------------------------------------------------
# Using a database you run yourself instead.
#
# Set ferretdb.enabled=false and give the URL here - a MongoDB 7 of your own, a
# FerretDB elsewhere, or a managed service. `directConnection=true` is appended
# unless your URL already sets it (wekan/wekan#6582: without it the driver drops
# the host you wrote and dials whatever the server advertises, which for FerretDB
# is 0.0.0.0:27017 and therefore the WeKan pod itself).
#
# The old `mongodb.url` value is still read, so an existing values.yaml that
# points at an external MongoDB keeps working after this upgrade.
# ------------------------------------------------------------------------------

externalDatabase:
  url: ""
  # url: "mongodb://user:password@mongodb.example.com:27017/wekan?authSource=admin"

# ------------------------------------------------------------------------------
# MongoDB (removed as a bundled dependency in chart 10.86.0).
#
# The chart used to install groundhog2k's MongoDB chart and build a MONGO_URL out
# of Bitnami's per-pod DNS names, which is charts#54 - the two never matched.
# WeKan itself has moved to FerretDB (charts#55), so the bundled database is
# FerretDB above.
#
# WHAT TO DO WITH THE DATA YOU ALREADY HAVE. Nothing here deletes it: the
# MongoDB StatefulSet and its PersistentVolumeClaim are left exactly as they are
# when you upgrade, and the fastest route is to keep using them -
#
#   ferretdb:
#     enabled: false
#   externalDatabase:
#     url: "mongodb://<release>-mongodb:27017/wekan"
#
# (that is the Service the groundhog2k chart really creates, which is what the
# old computed URL got wrong). To move onto FerretDB instead, dump from MongoDB
# and restore into it - both speak the MongoDB wire protocol, so mongodump and
# mongorestore work unchanged.
#
# `mongodb.url` is still honoured for compatibility; `mongodb.enabled` no longer
# installs anything.
# ------------------------------------------------------------------------------

mongodb:
  enabled: false
  url: ""
