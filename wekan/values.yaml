# ==== NOTIFICATION TRAY AFTER READ DAYS BEFORE REMOVE =====
# Number of days after a notification is read before we remove it.
# Default: 2
#  - name: "NOTIFICATION_TRAY_AFTER_READ_DAYS_BEFORE_REMOVE"
#    value: "2"
# ---------------------------------------------------------------
# ==== BIGEVENTS DUE ETC NOTIFICATIONS =====
# https://github.com/wekan/wekan/pull/2541
# Introduced a system env var BIGEVENTS_PATTERN default as "NONE",
# so any activityType matches the pattern, system will send out
# notifications to all board members no matter they are watching
# or tracking the board or not. Owner of the wekan server can
# disable the feature by setting this variable to "NONE" or
# change the pattern to any valid regex. i.e. '|' delimited
# activityType names.
# a) Example
#  - name: "BIGEVENTS_PATTERN"
#    value: "due"
# b) All
#  - name: "BIGEVENTS_PATTERN"
#    value: "received|start|due|end"
# c) Disabled
#  - name: "BIGEVENTS_PATTERN"
#    value: "NONE"
# ---------------------------------------------------------------
# ==== NOTIFY ON ASSIGN =====
# Notify the user directly when they are added as a card member or
# assignee. Set false to disable.
#  - name: "NOTIFY_ON_ASSIGN"
#    value: "true"
# ---------------------------------------------------------------
# ==== EMAIL DUE DATE NOTIFICATION =====
# https://github.com/wekan/wekan/pull/2536
# System timelines will be showing any user modification for
# dueat startat endat receivedat, also notification to
# the watchers and if any card is due, about due or past due.
# 
# Notify due days, default is None, 2 days before and on the event day
#  - name: "NOTIFY_DUE_DAYS_BEFORE_AND_AFTER"
#    value: "2,0"
# 
# Notify due at hour of day. Default every morning at 8am. Can be 0-23.
# If env variable has parsing error, use default. Notification sent to watchers.
#  - name: "NOTIFY_DUE_AT_HOUR_OF_DAY"
#    value: "8"
# -----------------------------------------------------------------
# ==== EMAIL NOTIFICATION TIMEOUT, ms =====
# Default: 30000 ms = 30s
#  - name: "EMAIL_NOTIFICATION_TIMEOUT"
#    value: "30000"
